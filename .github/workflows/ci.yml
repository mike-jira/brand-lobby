name: CI
on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: .nvmrc
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: run test
        run: npm test
      - name: build
        run: npm run build
